<section class="not-found-page">

  <div class="not-found-container">

    <!-- BRAND -->
    <div class="brand">
      <div class="logo-icon">NF</div>
      <span>NUTRIFORGE</span>
    </div>

    <!-- 404 -->
    <div class="error-code">
      4<span>0</span>4
    </div>

    <!-- MESSAGE -->
    <h1>Oops! Page Not Found</h1>

    <p class="description">
      Looks like you've taken a wrong turn.
      This page doesn't exist or may have been moved.
    </p>

    <p class="motivation">
      Don't lose your momentum. Get back on track!
    </p>

    <!-- BUTTONS -->
    <div class="action-buttons">

      <a routerLink="/" class="home-btn">
        Back to Home
      </a>

      <button
        type="button"
        class="back-btn"
        (click)="goBack()"
      >
        Go Back
      </button>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      <span>BUILD STRONGER. LIVE BETTER.</span>
    </div>

  </div>

</section>
